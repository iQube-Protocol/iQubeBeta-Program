name: Deploy Operations Manual to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/operating-manual/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUILD_DIR: docs/operating-manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ${{ env.BUILD_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          npm ci || npm install

      - name: Debug env
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          node -v
          npm -v
          ls -la
          cat package.json

      - name: Build site
        working-directory: ${{ env.BUILD_DIR }}
        run: npx --yes @docusaurus/core@3.8.1 docusaurus build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
