name: ICP Canisters CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    # Manual dispatch inputs (ensure Run workflow button appears)
    inputs:
      deploy_pos:
        description: "Deploy proof_of_state to IC"
        type: boolean
        default: true
      deploy_dvn:
        description: "Deploy cross_chain_service (DVN) to IC"
        type: boolean
        default: true
      deploy_evm:
        description: "Deploy evm_rpc to IC"
        type: boolean
        default: true
      deploy_btc:
        description: "Deploy btc_signer_psbt to IC"
        type: boolean
        default: true

jobs:
  build-canisters:
    name: Build Rust canisters (no replica)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            canisters/**

      - name: Build Rust canisters
        env:
          RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals"
        run: |
          set -e
          # Build each canister crate (remove --locked due to Cargo.lock updates)
          cargo build --target wasm32-unknown-unknown --release -p proof_of_state
          cargo build --target wasm32-unknown-unknown --release -p btc_signer_psbt
          cargo build --target wasm32-unknown-unknown --release -p cross_chain_service
          cargo build --target wasm32-unknown-unknown --release -p evm_rpc

  web-and-sdk:
    name: Lint and build web + SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json; skipping npm install"
          fi

      - name: Build SDK packages
        run: |
          npm run -w packages/indexers build || true
          npm run -w packages/sdk-js build || true

      - name: Lint
        run: npm run lint || true

      - name: Build Next.js apps (Ops Console + 21 Sats Market)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
        run: |
          npm run -w apps/ops-console build || true
          npm run -w apps/21sats-market build || true

  e2e-anchor:
    name: "E2E Anchor Flow (dfx local)"
    runs-on: ubuntu-latest
    needs: build-canisters
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust with wasm32 target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          target: wasm32-unknown-unknown
          
      - name: Install dfx 0.29.1
        run: |
          wget https://github.com/dfinity/sdk/releases/download/0.29.1/dfx-0.29.1-x86_64-linux.tar.gz
          tar -xzf dfx-0.29.1-x86_64-linux.tar.gz
          sudo mv dfx /usr/local/bin/
          dfx --version
          
      - name: Start replica
        run: |
          dfx start --background --clean
          sleep 5
          
      - name: Update Cargo.lock
        run: cargo update
        
      - name: Deploy proof_of_state and run anchor flow
        run: |
          # Deploy only proof_of_state canister for anchor flow test
          dfx deploy proof_of_state
          
          # Test the anchor flow: issue_receipt -> batch -> anchor -> get_batches
          {
            echo "-- get_pending_count --"
            dfx canister call proof_of_state get_pending_count
            
            echo "-- issue_receipt --"
            RECEIPT_ID=$(dfx canister call proof_of_state issue_receipt '("deadbeefdeadbeefdeadbeefdeadbeef")' | grep -o '"[^"]*"' | tr -d '"')
            echo $RECEIPT_ID
            
            echo "-- batch --"
            BATCH_ROOT=$(dfx canister call proof_of_state batch | grep -o '"[^"]*"' | tr -d '"')
            echo $BATCH_ROOT
            
            echo "-- anchor --"
            dfx canister call proof_of_state anchor
            
            echo "-- get_batches --"
            dfx canister call proof_of_state get_batches
          } | tee anchor_flow.log
        
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-anchor-logs
          path: anchor_flow.log
          if-no-files-found: warn
          
      - name: Stop replica
        run: dfx stop

  deploy-ic-mainnet:
    name: Deploy to IC (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      DFX_NETWORK: ic
      DFX_IDENTITY: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dfx SDK (Linux tarball)
        shell: bash
        run: |
          set -euo pipefail
          DFX_VERSION=0.29.2
          curl -fsSL -o dfx.tgz "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz"
          tar -xzf dfx.tgz
          sudo mv dfx /usr/local/bin/dfx
          dfx --version

      - name: Setup Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown

      - name: Import staging identity from PEM
        shell: bash
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${DFX_IDENTITY_PEM:-}" ]; then
            echo "DFX_IDENTITY_PEM secret is missing" >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/dfx/identity/staging"
          chmod 700 "$HOME/.config/dfx/identity/staging"
          printf "%s\n" "$DFX_IDENTITY_PEM" > "$HOME/.config/dfx/identity/staging/identity.pem"
          chmod 600 "$HOME/.config/dfx/identity/staging/identity.pem"
          dfx identity use staging
          dfx identity whoami
          dfx identity get-principal

      - name: Configure wallet (optional)
        shell: bash
        env:
          CYCLES_WALLET_ID: ${{ secrets.CYCLES_WALLET_ID }}
        run: |
          set -euo pipefail
          export DFX_WARNING=-mainnet_plaintext_identity
          if [ -n "${CYCLES_WALLET_ID:-}" ]; then
            echo "Setting wallet to ${CYCLES_WALLET_ID}"
            # Try to install wallet WASM if needed, skip if already exists
            echo "Installing wallet WASM into canister ${CYCLES_WALLET_ID}..."
            dfx identity deploy-wallet --network ic "$CYCLES_WALLET_ID" || echo "Wallet already exists, skipping installation"
            echo "Setting wallet for identity..."
            dfx identity set-wallet --network ic "$CYCLES_WALLET_ID" || true
          else
            echo "No CYCLES_WALLET_ID provided. Will rely on default wallet if configured."
          fi
          dfx wallet --network ic balance || true

      - name: Deploy selected canisters to IC
        if: ${{ github.event.inputs.deploy_pos == 'true' || github.event.inputs.deploy_dvn == 'true' || github.event.inputs.deploy_evm == 'true' || github.event.inputs.deploy_btc == 'true' }}
        shell: bash
        env:
          CYCLES_WALLET_ID: ${{ secrets.CYCLES_WALLET_ID }}
        run: |
          set -euo pipefail
          export DFX_WARNING=-mainnet_plaintext_identity

          deploy_one() {
            local name="$1"; local flag="$2"
            if [ "$flag" = "true" ]; then
              echo "::group::Deploy $name"
              if [ -n "${CYCLES_WALLET_ID:-}" ]; then
                dfx canister create "$name" --network ic --wallet "$CYCLES_WALLET_ID" || true
                dfx deploy "$name" --network ic --wallet "$CYCLES_WALLET_ID"
              else
                dfx canister create "$name" --network ic || true
                dfx deploy "$name" --network ic
              fi
              id=$(dfx canister id "$name" --network ic)
              echo "$name=$id" | tee -a canister-ids-staging.env
              echo "::endgroup::"
            else
              echo "Skip $name"
            fi
          }

          deploy_one proof_of_state "${{ github.event.inputs.deploy_pos }}"
          deploy_one cross_chain_service "${{ github.event.inputs.deploy_dvn }}"
          deploy_one evm_rpc "${{ github.event.inputs.deploy_evm }}"
          deploy_one btc_signer_psbt "${{ github.event.inputs.deploy_btc }}"

          echo "Canister IDs written to canister-ids-staging.env"
          cat canister-ids-staging.env

      - name: Upload canister IDs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canister-ids-staging
          path: canister-ids-staging.env
          if-no-files-found: warn

      - name: Export hints for staging env
        if: success()
        shell: bash
        run: |
          if [ -f canister-ids-staging.env ]; then
            echo "Add the following to your staging environment (server + NEXT_PUBLIC):"
            while IFS='=' read -r k v; do
              case "$k" in
                proof_of_state)
                  echo "PROOF_OF_STATE_CANISTER_ID=$v"
                  echo "NEXT_PUBLIC_PROOF_OF_STATE_CANISTER_ID=$v"
                  ;;
                cross_chain_service)
                  echo "CROSS_CHAIN_SERVICE_CANISTER_ID=$v"
                  echo "NEXT_PUBLIC_CROSS_CHAIN_SERVICE_CANISTER_ID=$v"
                  ;;
                evm_rpc)
                  echo "EVM_RPC_CANISTER_ID=$v"
                  echo "NEXT_PUBLIC_EVM_RPC_CANISTER_ID=$v"
                  ;;
                btc_signer_psbt)
                  echo "BTC_SIGNER_CANISTER_ID=$v"
                  echo "NEXT_PUBLIC_BTC_SIGNER_CANISTER_ID=$v"
                  ;;
              esac
            done < canister-ids-staging.env
          else
            echo "No canister-ids-staging.env generated."
          fi

  e2e-cross-chain:
    name: "E2E Cross-Chain DVN (dfx local)"
    runs-on: ubuntu-latest
    needs: build-canisters
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust with wasm32 target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          target: wasm32-unknown-unknown
          
      - name: Install dfx 0.29.1
        run: |
          wget https://github.com/dfinity/sdk/releases/download/0.29.1/dfx-0.29.1-x86_64-linux.tar.gz
          tar -xzf dfx-0.29.1-x86_64-linux.tar.gz
          sudo mv dfx /usr/local/bin/
          dfx --version
          
      - name: Start replica
        run: |
          dfx start --background --clean
          sleep 5
          
      - name: Update Cargo.lock
        run: cargo update
        
      - name: Deploy cross-chain service and run DVN flow
        run: |
          # Deploy cross-chain service canister
          dfx deploy cross_chain_service
          
          # Test LayerZero DVN message verification E2E flow
          {
            echo "=== Cross-Chain DVN Message Verification E2E Test ==="
            
            echo "-- get_pending_messages (should be empty) --"
            dfx canister call cross_chain_service get_pending_messages
            
            echo "-- submit_dvn_message --"
            MESSAGE_ID=$(dfx canister call cross_chain_service submit_dvn_message '(
              1 : nat32,
              137 : nat32,
              vec {1; 2; 3; 4},
              "0x1234567890abcdef1234567890abcdef12345678"
            )' | grep -o '"[^"]*"' | tr -d '"')
            echo "Submitted message: $MESSAGE_ID"
            
            echo "-- get_dvn_message --"
            dfx canister call cross_chain_service get_dvn_message "(\"$MESSAGE_ID\")"
            
            echo "-- submit_attestation (DVN 1) --"
            dfx canister call cross_chain_service submit_attestation "(
              \"$MESSAGE_ID\",
              \"dvn_validator_1\",
              vec {0xde; 0xad; 0xbe; 0xef}
            )"
            
            echo "-- get_message_attestations (1 attestation) --"
            dfx canister call cross_chain_service get_message_attestations "(\"$MESSAGE_ID\")"
            
            echo "-- submit_attestation (DVN 2) --"
            dfx canister call cross_chain_service submit_attestation "(
              \"$MESSAGE_ID\", 
              \"dvn_validator_2\",
              vec {0xca; 0xfe; 0xba; 0xbe}
            )"
            
            echo "-- get_message_attestations (2 attestations - ready for execution) --"
            dfx canister call cross_chain_service get_message_attestations "(\"$MESSAGE_ID\")"
            
            echo "-- monitor_evm_transaction --"
            dfx canister call cross_chain_service monitor_evm_transaction '(
              1 : nat32,
              "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890",
              "https://eth-mainnet.g.alchemy.com/v2/demo"
            )'
            
            echo "-- verify_layerzero_message (mock DVN endpoint) --"
            dfx canister call cross_chain_service verify_layerzero_message '(
              137 : nat32,
              "0x1234567890abcdef1234567890abcdef12345678",
              "https://api.layerzero.network/v1/dvn"
            )'
            
            echo "-- get_pending_messages (should show our message) --"
            dfx canister call cross_chain_service get_pending_messages
            
            echo "=== Cross-Chain DVN E2E Test Complete ==="
          } | tee cross_chain_flow.log
        
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cross-chain-logs
          path: cross_chain_flow.log
          if-no-files-found: warn
          
      - name: Stop replica
        run: dfx stop
