[package]
name = "reputation_qube"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.13"
ic-cdk-timers = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ic-stable-structures = "0.6"

# `features = ["export"]` removed 2026-08-08: ic-cdk-macros 0.9.0 declares no
# such feature, so dependency resolution FAILED for the entire workspace and no
# canister here could be built or tested at all. Unblocking this was a
# precondition for running the Phase B acceptance tests.
[dependencies.ic-cdk-macros]
version = "0.9"
